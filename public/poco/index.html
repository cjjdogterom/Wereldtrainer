<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poco a Poco</title>
<meta name="description" content="Dagelijks een half uur Spaans: nieuwe woorden, werkwoorden en zinnen met slimme herhaling.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Poco a Poco">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1424" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --surface2:#F2F4F9; --ink:#17213A; --ink2:#4B5670; --muted:#828CA3; --line:#E2E6EF;
  --accent:#1E4DD8; --accent-ink:#FFFFFF; --accent-soft:#E7EDFB; --saffron:#E3B02A; --saffron-soft:#FBF2D3;
  --ok:#1E8E5A; --ok-soft:#DFF3E8; --warn:#B27515; --warn-soft:#FBEFD6; --bad:#C8392B; --bad-soft:#FBE3E0;
  --shadow:0 1px 2px rgba(23,33,58,.05),0 10px 30px rgba(23,33,58,.07);
  --display:"Fraunces",Georgia,"Times New Roman",serif; --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#161D31; --surface2:#1E2740; --ink:#EEF1F8; --ink2:#B8C0D4; --muted:#7F89A3; --line:#2A3452;
  --accent:#7C9EFF; --accent-ink:#0E1424; --accent-soft:#22305A; --saffron:#F0C24A; --saffron-soft:#3A3116;
  --ok:#4CC38A; --ok-soft:#153426; --warn:#E0A83A; --warn-soft:#3A2E12; --bad:#F0705F; --bad-soft:#3F1F1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#161D31; --surface2:#1E2740; --ink:#EEF1F8; --ink2:#B8C0D4; --muted:#7F89A3; --line:#2A3452;
  --accent:#7C9EFF; --accent-ink:#0E1424; --accent-soft:#22305A; --saffron:#F0C24A; --saffron-soft:#3A3116;
  --ok:#4CC38A; --ok-soft:#153426; --warn:#E0A83A; --warn-soft:#3A2E12; --bad:#F0705F; --bad-soft:#3F1F1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,.chip,.choice,.item,.tabs button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
input:not([type=checkbox]),textarea{-webkit-appearance:none;appearance:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}

#app{max-width:720px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 0 10px;background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.01em}
.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:20px;font-weight:600;line-height:1;transform:translateY(3px)}
.top-right{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink2)}
.streak{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--saffron-soft);color:var(--ink);font-weight:700}
.streak svg{width:14px;height:14px;fill:var(--saffron)}
.sync{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on{background:var(--ok)} .sync.busy{background:var(--saffron)}

main{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
@media (max-width:420px){.card{padding:16px} h1{font-size:26px} .pcard{padding:20px 16px;border-radius:16px} .grid4{gap:8px} .tile{padding:10px 12px} .tile b{font-size:22px}}
.card.hero{position:relative;overflow:hidden;box-shadow:var(--shadow);border-color:transparent}
.card.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,var(--accent-soft) 0 22%,transparent 23%),radial-gradient(circle,var(--saffron-soft) 0 40%,transparent 41%);opacity:.9;pointer-events:none}
.card.hero>*{position:relative;z-index:1}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.grid4{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface2);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-family:var(--display);font-size:26px;font-weight:500;line-height:1.1}
.tile span{font-size:13px;color:var(--ink2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:700;background:var(--accent);color:var(--accent-ink);transition:transform .08s ease,filter .15s}
@media (hover:hover){.btn:hover{filter:brightness(1.06)}} .btn:active{transform:translateY(1px)}
.btn.big{width:100%;padding:16px 20px;font-size:17px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.outline{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}

.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.bar.gold>i{background:var(--saffron)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.nieuw{background:var(--surface2);color:var(--ink2)} .pill.leren{background:var(--saffron-soft);color:var(--warn)}
.pill.bekend{background:var(--accent-soft);color:var(--accent)} .pill.beheerst{background:var(--ok-soft);color:var(--ok)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--line)}
.dot.leren{background:var(--saffron)} .dot.bekend{background:var(--accent)} .dot.beheerst{background:var(--ok)}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 10px;font-size:11px;font-weight:700;color:var(--muted);min-width:0}
@media (max-width:400px){.tabs button{font-size:9.5px}.tabs button svg{width:20px;height:20px}}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.active{color:var(--accent)}
@media (max-width:759px){ body.practicing .tabs{display:none} body.practicing #app{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))} }
@media (min-width:760px){
  #app{padding-bottom:40px}
  .tabs{position:static;border:0;background:transparent;justify-content:flex-start;gap:6px;padding:4px 0 10px}
  .tabs button{flex:0 0 auto;flex-direction:row;padding:8px 14px;border-radius:999px;font-size:14px}
  .tabs button.active{background:var(--accent-soft)}
}

/* lijsten */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);text-align:left;width:100%}
.item:first-child{border-top:0}
.item .es{font-family:var(--display);font-size:19px;font-weight:500}
.item .nl{font-size:14px;color:var(--ink2)}
.item .grow{flex:1;min-width:0}
.item .nl,.item .es{overflow-wrap:anywhere}
.detail{background:var(--surface2);border-radius:12px;padding:14px;margin:0 0 8px;font-size:14px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
select.search{appearance:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;color:var(--ink2)}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.word{font-family:var(--display);font-size:18px;font-weight:500;color:var(--ink);padding:8px 14px;background:var(--surface2)}
.chip.word.used{opacity:.3}

/* oefenen */
.practice-top{display:flex;align-items:center;gap:12px}
.practice-top .bar{flex:1}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 22px;box-shadow:var(--shadow);min-height:300px;display:flex;flex-direction:column;gap:18px}
.pcard .word{font-family:var(--display);font-size:clamp(30px,7vw,44px);font-weight:500;line-height:1.1;overflow-wrap:anywhere}
.pcard .prompt{font-size:20px;line-height:1.4}
.pcard .sub{font-size:17px;color:var(--ink2)}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:17px;transition:border-color .12s,background .12s}
@media (hover:hover){.choice:hover{border-color:var(--accent)}} .choice:active{background:var(--surface2)}
.choice .k{width:24px;height:24px;border-radius:7px;background:var(--surface2);display:inline-grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);flex:0 0 auto}
.choice.right{border-color:var(--ok);background:var(--ok-soft)} .choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice[disabled]{cursor:default}
.choice.again{cursor:pointer} @media (hover:hover){.choice.again:hover{border-color:var(--ok)}}
.choice .go{margin-left:auto;color:var(--ok);font-size:22px;font-weight:700;line-height:1;flex:0 0 auto}
.answer{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);font-size:20px;font-family:var(--display)}
.answer.ok{border-color:var(--ok)} .answer.bad{border-color:var(--bad)} .answer.almost{border-color:var(--warn)}
.pcard input.fb{caret-color:transparent;pointer-events:none}
.ansform{display:block;margin:0;width:100%}
.spk{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);vertical-align:middle;flex:0 0 auto}
.spk svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spk.sm{width:30px;height:30px;margin-right:4px} .spk.sm svg{width:16px;height:16px}
.spk:active{background:var(--accent);color:var(--accent-ink)}
.word .spk{transform:translateY(-6px)}
.conj .f[data-action]{cursor:pointer;border-radius:6px;padding:0 4px}
@media (hover:hover){.conj .f[data-action]:hover{background:var(--accent-soft)}}
.accents{display:flex;gap:6px;flex-wrap:wrap}
.accents button{padding:6px 10px;border-radius:8px;background:var(--surface2);font-family:var(--display);font-size:18px;min-width:38px}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)} .feedback.wrong{background:var(--bad-soft);color:var(--bad)} .feedback.almost{background:var(--warn-soft);color:var(--warn)}
.feedback b{font-family:var(--display);font-size:20px;font-weight:500}
.feedback .corr{color:var(--ink);font-size:17px}
.conj{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:16px}
.conj div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.conj .p{color:var(--muted);font-size:14px}
.conj .f{font-family:var(--display);font-size:18px;text-align:right}
.conj .f.irr{color:var(--accent);font-weight:600}
.conj input{width:100%;padding:8px 10px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface2);font-family:var(--display);font-size:18px}
.conj input.ok{border-color:var(--ok)} .conj input.bad{border-color:var(--bad)} .conj input.almost{border-color:var(--warn)}
@media (max-width:480px){.conj{grid-template-columns:1fr}}
.drill{display:flex;flex-direction:column;gap:10px}
.drill label{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px;color:var(--ink2)}
.drill input{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);font-family:var(--display);font-size:20px;width:100%}
.drill input.ok{border-color:var(--ok)} .drill input.bad{border-color:var(--bad)} .drill input.almost{border-color:var(--warn)}
.build{min-height:56px;padding:10px;border-radius:12px;border:1.5px dashed var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--saffron-soft);color:var(--ink);font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.actions .btn{flex:1}
.pcard .cloze{font-family:var(--display);font-size:26px;line-height:1.35}
.pcard .cloze u{text-decoration:none;border-bottom:3px solid var(--accent);padding:0 6px;color:var(--accent);letter-spacing:.15em}
.table{width:100%;border-collapse:collapse;font-size:15px}
.table th{text-align:left;color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px}
.table td{padding:6px 8px;border-top:1px solid var(--line)}
.scroll-x{overflow-x:auto}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .grid{stroke:var(--line)} .chart .target{stroke:var(--muted);stroke-dasharray:3 4}
.chart rect{fill:var(--accent)} .chart rect.hit{fill:var(--saffron)} .chart rect.today{stroke:var(--ink);stroke-width:1}
.cats{display:flex;flex-direction:column;gap:10px}
.cats .row{gap:10px} .cats .name{width:44%;font-size:14px} .cats .bar{flex:1} .cats .n{width:64px;text-align:right;font-size:13px;color:var(--muted)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow select{padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
textarea.io{width:100%;min-height:90px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);font-family:ui-monospace,monospace;font-size:16px}
.hint{font-size:14px;color:var(--muted)}
.kbd{display:inline-block;padding:0 6px;border-radius:5px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.btn{transition:none}}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.mini{font-size:13px;color:var(--muted)}
.linkish{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="brand-mark">¡</span><span>Poco a Poco</span></div>
    <div class="top-right"><span id="syncDot" class="sync" title="Alleen op dit apparaat opgeslagen"></span><span id="streakTop" class="streak"></span></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-view="home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Vandaag</button>
    <button data-view="words"><svg viewBox="0 0 24 24"><path d="M4 4h9a3 3 0 0 1 3 3v13H7a3 3 0 0 0-3 3z"/><path d="M16 7a3 3 0 0 1 3-3h1v16h-4"/></svg>Woorden</button>
    <button data-view="verbs"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Werkwoorden</button>
    <button data-view="sentences"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><path d="M17 15l2 2 4-4"/></svg>Zinnen</button>
    <button data-view="progress"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Voortgang</button>
    <button data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Instellingen</button>
  </nav>
  <main id="view"></main>
</div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
